name: Train Model

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "*.py"
      - ".github/workflows/train.yml"

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch training data
        run: python fetch_data.py

      - name: Train
        run: python train.py

      - name: Commit trained checkpoint back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add checkpoints/ckpt.pt tokenizer_vocab.json
          git diff --staged --quiet || git commit -m "Update trained checkpoint [skip ci]"
          git push
